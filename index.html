
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Six Degrees of Letterboxd</title>
<style>
:root{--bg:#14181c;--card:#1f252c;--border:#2c3440;--text:#fff;--muted:#9ab;--orange:#ff8000;--green:#00e054;--blue:#40bcf4;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:2.5rem 1rem;line-height:1.5}
.container{max-width:720px;margin:auto;display:grid;gap:1.75rem}
header{text-align:center;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:.5rem}
.dot{width:14px;height:14px;border-radius:50%}
.orange{background:var(--orange)}.green{background:var(--green)}.blue{background:var(--blue)}
h1{font-size:1.65rem;letter-spacing:-.02em}
.subtitle,label{color:var(--muted)}.subtitle{font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1.5rem}
form{display:grid;gap:1.15rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;padding:.75rem .9rem;background:var(--bg);border:1px solid var(--border);border-radius:.5rem;color:var(--text);font-size:.95rem}
input:focus{outline:1px solid var(--green)}
button{background:var(--green);color:#081c0f;border:0;padding:.85rem 1.25rem;border-radius:.5rem;font-size:.95rem;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.status{text-align:center;color:var(--muted);padding:1rem 0}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.path-list{display:grid;gap:.5rem}
.step-card{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--bg);border:1px solid var(--border);border-radius:.5rem;padding:.85rem 1rem}
.step-left{display:flex;align-items:center;gap:.75rem;min-width:0}
.step-num{display:grid;place-items:center;flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:.75rem;font-weight:700}
.step-link{color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-link:hover{color:var(--blue);text-decoration:underline}
.type-badge{font-size:.7rem;font-weight:700;text-transform:uppercase;padding:.2rem .55rem;border-radius:4px;flex-shrink:0}
.badge-film{background:#ff800026;color:var(--orange)}.badge-actor{background:#00e05426;color:var(--green)}.badge-director{background:#40bcf426;color:var(--blue)}
.arrow{text-align:center;color:var(--muted);font-size:.85rem;line-height:1}
</style>
</head>
<body>
<main class="container">
<header>
<div class="dots"><span class="dot orange"></span><span class="dot green"></span><span class="dot blue"></span></div>
<h1>Six Degrees of Letterboxd</h1>
<p class="subtitle">Find the shortest chain connecting any two films, actors, or directors</p>
</header>
<section class="card">
<form id="search-form">
<div><label for="from_url">Starting URL (Film, Actor, or Director)</label>
<input type="url" id="from_url" value="https://letterboxd.com/film/a-silent-voice-the-movie/" required></div>
<div><label for="to_url">Target URL (Film, Actor, or Director)</label>
<input type="url" id="to_url" value="https://letterboxd.com/actor/shunsuke-takeuchi/" required></div>
<button id="submit-btn">Find Connection Path</button>
</form>
</section>
<section class="card" id="result-card" hidden>
<div id="status-area" class="status" aria-live="polite"></div>
<div id="path-container" class="path-list"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const form=$('search-form'),btn=$('submit-btn'),card=$('result-card');
const status=$('status-area'),list=$('path-container');
function badge(url){
const type=url.match(/\/(film|actor|director)\//)?.[1];
return type?`<span class="type-badge badge-${type}">${type}</span>`:'';
}
form.addEventListener('submit',async e=>{
e.preventDefault();
card.hidden=false;list.replaceChildren();btn.disabled=true;
status.innerHTML='<span class="spinner"></span>Crawling Letterboxd graph... Check your Go terminal for live progress!';
try{
const res=await fetch('/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_url:$('from_url').value.trim(),to_url:$('to_url').value.trim()})});
if(!res.ok)throw Error((await res.text())||'Search failed');
const data=await res.json();
const steps=data.path.split(' -> ').map(s=>s.trim()).filter(Boolean);
const degrees=Math.max(0,steps.length-1);
status.innerHTML=`<strong style="color:var(--green)">🎉 Found in ${degrees} ${degrees===1?'hop':'hops'}!</strong>`;
steps.forEach((url,i)=>{
const row=document.createElement('div');row.className='step-card';
const left=document.createElement('div');left.className='step-left';
const num=document.createElement('span');num.className='step-num';num.textContent=i+1;
const link=document.createElement('a');link.className='step-link';link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=url;
left.append(num,link);row.append(left);
row.insertAdjacentHTML('beforeend',badge(url));list.append(row);
if(i<steps.length-1){const arrow=document.createElement('div');arrow.className='arrow';arrow.textContent='↓';list.append(arrow);}
});
}catch(err){
status.textContent='❌ '+err.message;status.style.color='var(--danger)';
}finally{btn.disabled=false;}
});
</script>
</body>
</html>
