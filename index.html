<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Six Degrees of Letterboxd</title>
  <style>
    :root {
      --bg: #14181c;
      --card: #1f252c;
      --border: #2c3440;
      --text: #ffffff;
      --muted: #9ab;
      --orange: #ff8000;
      --green: #00e054;
      --blue: #40bcf4;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2.5rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      gap: 1.75rem;
    }

    header {
      text-align: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .dots {
      display: inline-flex;
      gap: 6px;
      margin-bottom: 0.5rem;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .dot.orange { background: var(--orange); }
    .dot.green { background: var(--green); }
    .dot.blue { background: var(--blue); }

    h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
    }

    .form-grid {
      display: grid;
      gap: 1.15rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="url"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus {
      border-color: var(--green);
    }

    button {
      background: var(--green);
      color: #081c0f;
      border: none;
      padding: 0.85rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      width: 100%;
    }

    button:hover { opacity: 0.9; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
      padding: 1rem 0;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .path-list {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .step-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .step-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      overflow: hidden;
    }

    .step-num {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-link:hover {
      color: var(--blue);
      text-decoration: underline;
    }

    .type-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .badge-film { background: rgba(255, 128, 0, 0.15); color: var(--orange); }
    .badge-actor { background: rgba(0, 224, 84, 0.15); color: var(--green); }
    .badge-director { background: rgba(64, 188, 244, 0.15); color: var(--blue); }

    .arrow {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="dots">
        <span class="dot orange"></span>
        <span class="dot green"></span>
        <span class="dot blue"></span>
      </div>
      <h1>Six Degrees of Letterboxd</h1>
      <p class="subtitle">Find the shortest chain connecting any two films, actors, or directors</p>
    </header>

    <div class="card">
      <form id="search-form" class="form-grid">
        <div>
          <label for="from_url">Starting URL (Film, Actor, or Director)</label>
          <input
            type="url"
            id="from_url"
            placeholder="https://letterboxd.com/film/a-silent-voice-the-movie/"
            value="https://letterboxd.com/film/a-silent-voice-the-movie/"
            required
          />
        </div>

        <div>
          <label for="to_url">Target URL (Film, Actor, or Director)</label>
          <input
            type="url"
            id="to_url"
            placeholder="https://letterboxd.com/actor/shunsuke-takeuchi/"
            value="https://letterboxd.com/actor/shunsuke-takeuchi/"
            required
          />
        </div>

        <button type="submit" id="submit-btn">Find Connection Path</button>
      </form>
    </div>

    <div class="card" id="result-card" style="display: none;">
      <div id="status-area" class="status"></div>
      <div id="path-container" class="path-list"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('search-form');
    const submitBtn = document.getElementById('submit-btn');
    const resultCard = document.getElementById('result-card');
    const statusArea = document.getElementById('status-area');
    const pathContainer = document.getElementById('path-container');

    function getBadge(url) {
      if (url.includes('/film/')) return '<span class="type-badge badge-film">Film</span>';
      if (url.includes('/actor/')) return '<span class="type-badge badge-actor">Actor</span>';
      if (url.includes('/director/')) return '<span class="type-badge badge-director">Director</span>';
      return '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fromUrl = document.getElementById('from_url').value.trim();
      const toUrl = document.getElementById('to_url').value.trim();

      resultCard.style.display = 'block';
      pathContainer.innerHTML = '';
      submitBtn.disabled = true;
      statusArea.innerHTML = '<span class="spinner"></span> Crawling Letterboxd graph... Check your Go terminal for live progress!';

      try {
        const res = await fetch('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from_url: fromUrl, to_url: toUrl })
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || 'Search failed');
        }

        const data = await res.json();
        const steps = data.path.split(' -> ').map(s => s.trim()).filter(Boolean);
        const degrees = Math.max(0, steps.length - 1);

        statusArea.innerHTML = `<strong style="color: var(--green);">🎉 Found in ${degrees} ${degrees === 1 ? 'hop' : 'hops'}!</strong>`;

        pathContainer.innerHTML = steps.map((stepUrl, idx) => {
          const arrow = idx < steps.length - 1 ? '<div class="arrow">↓</div>' : '';
          return `
            <div class="step-card">
              <div class="step-left">
                <span class="step-num">${idx + 1}</span>
                <a href="${stepUrl}" target="_blank" class="step-link">${stepUrl}</a>
              </div>
              ${getBadge(stepUrl)}
            </div>
            ${arrow}
          `;
        }).join('');

      } catch (err) {
        statusArea.innerHTML = `<span style="color: var(--danger);">❌ ${err.message}</span>`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
